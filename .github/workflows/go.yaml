name: Go

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Upstream releases and advisories land without a push.
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Same landrun as reverse-bin-hosting's runtime-versions.env; v0.2.0
      # changes sandbox behaviour and output.
      - run: go install github.com/zouuup/landrun/cmd/landrun@v0.1.17
      # Ubuntu's AppArmor blocks the unprivileged user namespaces unshare needs.
      - run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: make check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: goinstall  # build with go.mod's toolchain
      - name: deps-check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make deps-check
