---
name: Test Go

on:
  push:
    branches: [main, master]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "scripts/**"
      - "release-notes/**"
      - "RELEASE-PROCESS.md"
      - ".github/workflows/release.yml"
      - ".github/workflows/test-go.yaml"
  pull_request:
    branches: [main, master]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "scripts/**"
      - "release-notes/**"
      - "RELEASE-PROCESS.md"
      - ".github/workflows/release.yml"
      - ".github/workflows/test-go.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testGo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run full test suite
        env:
          # GitHub-hosted runners forbid user namespaces (unshare
          # --map-current-user fails), so the --as-app runtime sandbox
          # cannot be exercised here. RBD_NO_SANDBOX=1 explicitly opts into
          # running the functional sandbox-exec tests without the isolation
          # layer; the isolation assertions skip with an explicit message.
          # Never silently: without this env, tests fail loudly when user
          # namespaces are unavailable.
          RBD_NO_SANDBOX: "1"
        run: make check
